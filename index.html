<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Brain Break</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:#f7f7fb;background:#10121a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#292d45,#10121a 55%);display:flex;justify-content:center}#app{width:min(100%,520px);padding:env(safe-area-inset-top) 18px 28px}header{display:flex;justify-content:space-between;align-items:center;padding:18px 2px}.brand{font-weight:850;font-size:25px}.pill{background:#ffffff16;padding:8px 12px;border-radius:999px;font-weight:700}.card{background:#ffffff10;border:1px solid #ffffff16;border-radius:28px;padding:24px;box-shadow:0 20px 50px #0005;min-height:560px}.eyebrow{opacity:.6;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:31px;margin:8px 0}p{color:#d8d9e3;line-height:1.4}button{border:0;border-radius:18px;padding:16px 18px;font-size:17px;font-weight:800;background:#fff;color:#111;touch-action:manipulation}.primary{width:100%;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.choice{min-height:82px;background:#ffffff12;color:white;border:1px solid #ffffff1b}.choice:active{transform:scale(.98)}.big{font-size:68px;text-align:center;margin:36px 0}.status{text-align:center;min-height:32px;font-weight:800;margin-top:16px}.target{height:270px;position:relative;margin:16px 0;background:#0b0d13;border-radius:22px;overflow:hidden}.block{position:absolute;width:55px;height:55px;background:#f1f2f6;border-radius:7px;transition:.3s}.ball{position:absolute;width:44px;height:44px;border-radius:50%;background:#fff;bottom:14px;left:calc(50% - 22px);transition:.45s cubic-bezier(.2,.8,.2,1)}.aim{width:100%;accent-color:white}.tiny{text-align:center;opacity:.6;font-size:13px}.memory{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.mem{aspect-ratio:1;border-radius:16px;background:#ffffff16}.mem.on{background:#fff}footer{text-align:center;opacity:.4;font-size:12px;margin-top:18px}
</style></head><body><div id="app"><header><div class="brand">Brain Break</div><div class="pill" id="score">0 pts</div></header><main class="card" id="game"></main><footer>No ads. No login. Just play.</footer></div>
<script>
let score=0,round=0;const G=document.getElementById('game'),S=document.getElementById('score');const puzzles=[{q:"Which number doesn't belong?",opts:["16","25","36","47"],a:3,why:"16, 25 and 36 are perfect squares."},{q:"What comes next? 2, 6, 12, 20, ?",opts:["26","28","30","32"],a:2,why:"The gaps are +4, +6, +8, then +10."},{q:"A bat and ball cost $1.10. The bat costs $1 more. Ball?",opts:["5¢","10¢","15¢","20¢"],a:0,why:"$1.05 + $0.05 = $1.10."},{q:"Which is heaviest?",opts:["1 lb feathers","1 lb steel","Same","Depends"],a:2,why:"They're both one pound."},{q:"If you pass the runner in 2nd place, you're now…",opts:["1st","2nd","3rd","Last"],a:1,why:"You take their position: second."},{q:"Odd one out: 3, 5, 7, 9, 11",opts:["3","7","9","11"],a:2,why:"9 is the only composite number."}];function pts(n=10){score+=n;S.textContent=score+" pts"}function next(){round++;const type=round%3;type===1?logic():type===2?knock():memory()}function base(k,title,sub){G.innerHTML=`<div class=eyebrow>${k}</div><h1>${title}</h1><p>${sub}</p>`}function logic(){const p=puzzles[Math.floor(Math.random()*puzzles.length)];base("Quick Think",p.q,"Pick your answer.");const d=document.createElement('div');d.className='grid';p.opts.forEach((x,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answer(i===p.a,p.why);d.appendChild(b)});G.appendChild(d);G.insertAdjacentHTML('beforeend','<div class=status id=st></div>')}function answer(ok,why){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);let st=document.getElementById('st');st.textContent=ok?"Correct! +10":"Not quite. "+why;if(ok)pts();setTimeout(next,1300)}function knock(){base("Knock Down","Clear the blocks","Aim, then fire. You get 3 shots.");G.insertAdjacentHTML('beforeend',`<div class=target id=t><div class=ball id=ball></div></div><input class=aim id=aim type=range min=10 max=90 value=50><button class=primary id=fire>FIRE</button><div class=status id=st>3 shots left</div>`);const t=document.getElementById('t');let blocks=[],shots=3;for(let r=0;r<3;r++)for(let c=0;c<3;c++){let b=document.createElement('div');b.className='block';b.style.left=(145+(c-1)*58)+'px';b.style.bottom=(20+r*58)+'px';t.appendChild(b);blocks.push(b)}fire.onclick=()=>{if(shots<=0)return;shots--;let x=+aim.value/100*t.clientWidth;ball.style.transform=`translate(${x-t.clientWidth/2}px,-205px)`;setTimeout(()=>{let hit=Math.max(1,Math.round(4-Math.abs(+aim.value-50)/13));for(let i=0;i<hit&&blocks.length;i++){let b=blocks.splice(Math.floor(Math.random()*blocks.length),1)[0];b.style.transform=`translate(${(Math.random()-.5)*180}px,${80+Math.random()*80}px) rotate(${Math.random()*180}deg)`;b.style.opacity=0}ball.style.transition='none';ball.style.transform='';setTimeout(()=>ball.style.transition='.45s cubic-bezier(.2,.8,.2,1)',30);if(!blocks.length){pts(20);st.textContent="Cleared! +20";setTimeout(next,1000)}else if(!shots){st.textContent="Out of shots — next challenge";setTimeout(next,1200)}else st.textContent=shots+" shots left"},480)}}function memory(){base("Flash Memory","Remember the tiles","Watch the pattern, then tap those same tiles.");let pattern=[...Array(9).keys()].sort(()=>Math.random()-.5).slice(0,3),chosen=[];let m=document.createElement('div');m.className='memory';for(let i=0;i<9;i++){let b=document.createElement('button');b.className='mem';b.dataset.i=i;m.appendChild(b)}G.appendChild(m);G.insertAdjacentHTML('beforeend','<div class=status id=st>Watch…</div>');let bs=[...document.querySelectorAll('.mem')];pattern.forEach(i=>bs[i].classList.add('on'));setTimeout(()=>{bs.forEach(b=>b.classList.remove('on'));st.textContent="Your turn";bs.forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(chosen.includes(i))return;chosen.push(i);b.classList.add('on');if(!pattern.includes(i)){st.textContent="Missed it — next one";setTimeout(next,900)}else if(chosen.length===3){pts(15);st.textContent="Perfect! +15";setTimeout(next,900)}})},1200)}base("Ad-free mini games","Ready for a Brain Break?","Fast logic, memory and knock-down challenges. Nothing interrupts you.");G.insertAdjacentHTML('beforeend','<div class=big>🧠</div><button class=primary id=start>START PLAYING</button><p class=tiny>Runs entirely on your device.</p>');start.onclick=next;
</script></body></html>
