<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111424"><title>Brain Break v2.4</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:#fff;background:#0b0d17}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100svh;background:radial-gradient(circle at 20% 0,#313862 0,#15182b 35%,#090b13 82%);overflow-x:hidden}#app{width:min(100%,520px);margin:auto;padding:max(env(safe-area-inset-top),12px) 16px max(env(safe-area-inset-bottom),24px)}header{display:flex;align-items:center;justify-content:space-between;padding:10px 3px 16px}.brand{font-size:25px;font-weight:900;letter-spacing:-.7px}.stats{display:flex;gap:7px}.pill{background:#ffffff13;border:1px solid #ffffff18;padding:7px 10px;border-radius:99px;font-size:13px;font-weight:800}.card{position:relative;min-height:600px;background:linear-gradient(155deg,#ffffff12,#ffffff07);border:1px solid #ffffff17;border-radius:30px;padding:23px;box-shadow:0 25px 70px #0008;overflow:hidden}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;opacity:.55}h1{font-size:31px;line-height:1.04;margin:7px 0 8px;letter-spacing:-1px}p{color:#d6d8e6;line-height:1.4;margin:7px 0 12px}.primary,button{font:inherit;border:0;border-radius:18px;font-weight:850;touch-action:manipulation}.primary{width:100%;padding:16px;background:#fff;color:#10121a;font-size:17px}.skip{display:block;margin:12px 0 4px auto;padding:10px 16px;border-radius:99px;background:#ffffff18;color:#fff;border:1px solid #ffffff30;font-size:13px;font-weight:900}.skip:active{transform:scale(.96)}.status{text-align:center;min-height:27px;margin-top:14px;font-weight:800;color:#eef}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:20px}.choice{min-height:82px;padding:12px;background:#ffffff10;color:#fff;border:1px solid #ffffff18;font-size:17px}.choice:active,.tap:active{transform:scale(.96)}.hero{font-size:76px;text-align:center;margin:48px 0 35px}.tiny{text-align:center;font-size:12px;opacity:.5;margin-top:13px}.progress{height:5px;background:#ffffff12;border-radius:9px;margin-bottom:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#fff;transition:.35s}.arena{position:relative;height:345px;margin:15px 0;border-radius:24px;background:linear-gradient(#171b31,#0b0d15);border:1px solid #ffffff12;overflow:hidden;touch-action:none}.floor{position:absolute;left:0;right:0;bottom:34px;height:4px;background:#ffffff28}.brick{position:absolute;width:50px;height:43px;border-radius:7px;background:linear-gradient(145deg,#f6f7fb,#aeb6d1);box-shadow:inset 0 -5px 0 #0002;transition:transform .65s cubic-bezier(.2,.7,.2,1),opacity .55s}.ball{position:absolute;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#cfd5eb 55%,#858eae);box-shadow:0 7px 16px #0008;z-index:5}.guide{position:absolute;height:3px;transform-origin:0 50%;background:linear-gradient(90deg,#fff9,#fff0);z-index:3;display:none}.hint{text-align:center;font-size:13px;color:#b9bdd0}.memory{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:28px 0}.mem{aspect-ratio:1;border-radius:18px;background:#ffffff10;border:1px solid #ffffff15}.mem.on{background:#fff;box-shadow:0 0 28px #ffffff66}.spot{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:27px 0}.spot button{aspect-ratio:1;background:#ffffff0c;color:#fff;font-size:31px;border:1px solid #ffffff10}.react{height:300px;margin:20px 0;border-radius:24px;background:#c74e5a;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;font-size:27px;font-weight:900;user-select:none;touch-action:manipulation}.react.go{background:#48c879}.sort{display:flex;justify-content:center;gap:14px;align-items:flex-end;height:245px;margin:20px 0}.sort button{display:block;flex:0 0 65px;min-height:40px;background:linear-gradient(180deg,#fff,#aeb8dc);color:#111;border-radius:12px 12px 7px 7px;box-shadow:0 8px 18px #0006;border:2px solid #ffffff55}.sequence{font-size:38px;text-align:center;font-weight:900;letter-spacing:3px;margin:44px 0 30px}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);background:#fff;color:#10121a;padding:18px 24px;border-radius:22px;font-size:20px;font-weight:900;opacity:0;pointer-events:none;z-index:20}.toast.show{animation:pop .7s}@keyframes pop{35%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}footer{text-align:center;font-size:11px;opacity:.35;padding:15px}
</style></head><body><div id="app"><header><div class="brand">Brain Break</div><div class="stats"><div class="pill" id="streak">🔥 0</div><div class="pill" id="score">0 pts</div></div></header><main class="card" id="game"></main><footer>No ads · No login · No nonsense · v2.4</footer></div>
<script>
const G=document.getElementById('game'),S=document.getElementById('score'),ST=document.getElementById('streak');let score=0,streak=0,round=0,last='',memoryLevel=3,gameToken=0;
const logicQuestions=[
["Which number doesn't belong?",["16","25","36","47"],3,"47 — the others are perfect squares."],
["You pass the runner in 2nd place. You're now…",["1st","2nd","3rd","Last"],1,"You take their place: 2nd."],
["A bat + ball cost $1.10. Bat costs $1 more. Ball?",["5¢","10¢","15¢","20¢"],0,"5¢. The bat is $1.05."],
["What comes next? 2, 6, 12, 20, ?",["26","28","30","32"],2,"The gaps are +4, +6, +8, +10."],
["Which weighs more?",["1 lb feathers","1 lb steel","Same","Depends"],2,"A pound is a pound."],
["Odd one out: 3, 5, 7, 9, 11",["3","7","9","11"],2,"9 is the only non-prime."]
];
const games=['logic','memory','spot','reaction','orderGame','smash','sequence'];
function base(k,t,s,canSkip=true){G.innerHTML='<div class="progress"><i style="width:'+((round%10)*10)+'%"></i></div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+s+'</p>'+(canSkip?'<button class="skip" id="skipBtn">Skip ›</button>':'')+'<div class="toast" id="toast"></div>';if(canSkip)document.getElementById('skipBtn').onclick=skipRound}
function lockSkip(){let b=document.getElementById('skipBtn');if(b)b.disabled=true}
function skipRound(){lockSkip();next()}
function buzz(n=20){if(navigator.vibrate)navigator.vibrate(n)}
function award(n,msg='Nice!'){lockSkip();score+=n;streak++;S.textContent=score+' pts';ST.textContent='🔥 '+streak;buzz(25);const t=document.getElementById('toast');if(t){t.textContent=msg+' +'+n;t.classList.add('show')}setTimeout(next,800)}
function miss(msg='Not quite'){lockSkip();streak=0;ST.textContent='🔥 0';buzz([25,35,25]);let s=document.getElementById('status');if(s)s.textContent=msg;setTimeout(next,1150)}
const gameFns={logic,memory,spot,reaction,orderGame,smash,sequence};function next(){gameToken++;round++;const pool=games.filter(x=>x!==last);last=pool[Math.floor(Math.random()*pool.length)];gameFns[last]()}
function logic(){let p=logicData();base('Quick Think',p[0],'Trust your brain. Maybe.');let d=document.createElement('div');d.className='grid';p[1].forEach((x,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{document.querySelectorAll('.choice').forEach(q=>q.disabled=true);i===p[2]?award(10,'Correct'):miss(p[3])};d.appendChild(b)});G.appendChild(d);G.insertAdjacentHTML('beforeend','<div class="status" id="status"></div>')}
function logicData(){return logicQuestions[Math.floor(Math.random()*logicQuestions.length)]}
function memory(){let token=gameToken,count=Math.min(6,memoryLevel);base('Flash Memory','Remember '+count+' tiles','They disappear fast.');G.insertAdjacentHTML('beforeend','<div class="memory" id="mem"></div><div class="status" id="status">Watch…</div>');let cells=[],pat=[...Array(9).keys()].sort(()=>Math.random()-.5).slice(0,count),chosen=[];for(let i=0;i<9;i++){let b=document.createElement('button');b.className='mem';b.dataset.i=i;mem.appendChild(b);cells.push(b)}pat.forEach(i=>cells[i].classList.add('on'));setTimeout(()=>{if(token!==gameToken)return;cells.forEach(x=>x.classList.remove('on'));document.getElementById('status').textContent='Your turn';cells.forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(chosen.includes(i))return;chosen.push(i);b.classList.add('on');if(!pat.includes(i)){memoryLevel=3;miss('Oops — pattern reset')}else if(chosen.length===count){memoryLevel=Math.min(6,memoryLevel+1);award(12+count,'Perfect')}})},950)}
function spot(){let sets=[['●','◉'],['▲','△'],['◆','◇'],['6','9'],['M','W'],['←','→']],z=sets[Math.floor(Math.random()*sets.length)],odd=Math.floor(Math.random()*16);base('Spot It','Find the odd one','One is different.');let d=document.createElement('div');d.className='spot';for(let i=0;i<16;i++){let b=document.createElement('button');b.textContent=i===odd?z[1]:z[0];b.onclick=()=>i===odd?award(14,'Found it'):miss('Wrong one');d.appendChild(b)}G.appendChild(d);G.insertAdjacentHTML('beforeend','<div class="status" id="status"></div>')}
function reaction(){let token=gameToken;base('Reflex','Wait for green','Tap too early and you lose the round.');G.insertAdjacentHTML('beforeend','<div class="react" id="react">WAIT…</div><div class="status" id="status"></div>');let go=false,start=0,done=false,t=setTimeout(()=>{if(token!==gameToken)return;go=true;start=performance.now();react.classList.add('go');react.textContent='TAP!'},1200+Math.random()*2200);react.onclick=()=>{if(done)return;done=true;if(!go){clearTimeout(t);miss('Too soon!')}else{let ms=Math.round(performance.now()-start);let n=ms<260?20:ms<360?16:12;award(n,ms+' ms')}}}
function orderGame(){const heights=[65,110,155,200].sort(()=>Math.random()-.5);base('Order Up','Shortest → tallest','Tap them in order.');G.insertAdjacentHTML('beforeend','<div class="sort" id="orderArea"></div><div class="status" id="status">0 / 4</div>');const area=document.getElementById('orderArea'),statusEl=document.getElementById('status'),ordered=[...heights].sort((a,b)=>a-b);let step=0;heights.forEach((h,i)=>{const b=document.createElement('button');b.type='button';b.style.cssText='height:'+h+'px;min-height:'+h+'px;display:block;flex:0 0 65px;background:linear-gradient(180deg,#fff,#aeb8dc);color:#111;border:2px solid #ffffff55';b.setAttribute('aria-label','Bar '+(i+1));b.textContent='↕';b.onclick=()=>{if(h!==ordered[step])return miss('Wrong order');b.style.opacity='.2';b.disabled=true;step++;statusEl.textContent=step+' / 4';if(step===4)award(15,'Sorted')};area.appendChild(b)})}
function sequence(){let start=1+Math.floor(Math.random()*5),step=2+Math.floor(Math.random()*5),a=[0,1,2,3].map(i=>start+i*step),ans=start+4*step,opts=[ans,ans+step,ans-1,ans+2].sort(()=>Math.random()-.5);base('Pattern','What comes next?','Find the rule.');G.insertAdjacentHTML('beforeend','<div class="sequence">'+a.join(' · ')+' · ?</div><div class="grid" id="opts"></div><div class="status" id="status"></div>');opts.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>x===ans?award(12,'Got it'):miss('It was '+ans);document.getElementById('opts').appendChild(b)})}
function smash(){base('Smash','Pull back. Let it fly.','Drag the ball backward, aim, and release. Knock down at least 5 blocks.');G.insertAdjacentHTML('beforeend','<div class="arena" id="arena"><div class="guide" id="guide"></div><div class="floor"></div><div class="ball" id="ball"></div></div><div class="hint">Pull the ball down and back, then release</div><div class="status" id="status">2 shots</div>');const A=document.getElementById('arena'),B=document.getElementById('ball'),D=document.getElementById('guide'),statusEl=document.getElementById('status');let shots=2,hits=0,drag=false,startX=0,startY=0,bx=45,by=250,raf=0;B.style.left=bx+'px';B.style.top=by+'px';let blocks=[];for(let r=0;r<3;r++)for(let col=0;col<3-r;col++){let el=document.createElement('div');el.className='brick';el.style.left=(250+col*52+r*26)+'px';el.style.bottom=(38+r*44)+'px';A.appendChild(el);blocks.push(el)}
function point(e){const r=A.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function resetBall(){B.style.transition='none';B.style.transform='';B.style.left=bx+'px';B.style.top=by+'px'}
B.onpointerdown=e=>{if(!shots)return;drag=true;B.setPointerCapture(e.pointerId);const p=point(e);startX=p.x;startY=p.y;D.style.display='block'};
B.onpointermove=e=>{if(!drag)return;const p=point(e),dx=Math.max(-75,Math.min(35,p.x-startX)),dy=Math.max(0,Math.min(90,p.y-startY));B.style.transform='translate('+dx+'px,'+dy+'px)';const len=Math.hypot(dx,dy);D.style.width=len+'px';D.style.left=(bx+23)+'px';D.style.top=(by+23)+'px';D.style.transform='rotate('+Math.atan2(dy,dx)+'rad)'};
B.onpointerup=e=>{if(!drag)return;drag=false;D.style.display='none';const p=point(e),pullX=Math.max(-75,Math.min(35,p.x-startX)),pullY=Math.max(0,Math.min(90,p.y-startY)),power=Math.hypot(pullX,pullY);if(power<18){resetBall();return}shots--;const r=A.getBoundingClientRect(),ballR=23;let x=bx,y=by,vx=(-pullX*.085)+4.2,vy=(-pullY*.105)-2.2,last=performance.now(),dead=false;B.style.transition='none';B.style.transform='';function hitTest(){blocks=[...blocks].filter(br=>{if(br.dataset.hit)return false;const rr=br.getBoundingClientRect(),ar=A.getBoundingClientRect(),left=rr.left-ar.left,top=rr.top-ar.top,right=left+rr.width,bottom=top+rr.height,cx=x+ballR,cy=y+ballR,nx=Math.max(left,Math.min(cx,right)),ny=Math.max(top,Math.min(cy,bottom));if((cx-nx)**2+(cy-ny)**2<=ballR**2){br.dataset.hit='1';hits++;br.style.transform='translate('+(vx*12)+'px,'+(-35-Math.abs(vy)*5)+'px) rotate('+(vx*18)+'deg)';br.style.opacity='.08';vx*=.78;vy-=1.4;return false}return true})}
function finish(){cancelAnimationFrame(raf);if(hits>=5)return award(20,'SMASH');if(!shots)return miss('You knocked '+hits+' down');statusEl.textContent=shots+' shot left';resetBall()}
function fly(now){if(dead)return;const dt=Math.min(2,(now-last)/16.67);last=now;vy+=.28*dt;x+=vx*dt;y+=vy*dt;B.style.left=x+'px';B.style.top=y+'px';hitTest();if(x>r.width+50||x<-60||y>r.height+55||y<-80){dead=true;finish();return}raf=requestAnimationFrame(fly)}raf=requestAnimationFrame(fly)}}
base('7 quick games','Take a Brain Break','Fast, tactile mini-games with no ads, no coins and no interruptions.',false);G.insertAdjacentHTML('beforeend','<div class="hero">🧠</div><button class="primary" id="start">PLAY</button><p class="tiny">Logic · Memory · Reflex · Spot It · Smash · Patterns · Sorting</p>');start.onclick=next;
</script></body></html>
